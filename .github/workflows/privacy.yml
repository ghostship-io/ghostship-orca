name: privacy

# The privacy gate. Every repository in this fleet is treated as public, so a
# value that reads as a person's identity, a private account or a purchase
# identifier fails the build. The gate scans the tracked tree, the commit
# messages of the range the pull request carries, and the pull request title
# and body, because the forge publishes all three.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A pull request's newer push supersedes its older run. Each commit on main
# runs to completion (its own group), so merges never cancel each other.
concurrency:
  group: privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject personal and account data in the tracked tree
        run: python3 scripts/check-privacy.py
      - name: Reject personal and account data in commit messages and pull request text
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="${{ github.sha }}^"
            fi
            range="$before..${{ github.sha }}"
          fi
          python3 scripts/check-privacy.py --commit-range "$range" --pr-event "$GITHUB_EVENT_PATH"
